# Novelizer global configuration.
# Location: ~/.config/novelizer/config.toml  (or $XDG_CONFIG_HOME/novelizer/config.toml)
#
# Layering: built-in defaults <- this file <- story.toml <- NOVELIZER_* env vars.
# Any setting here can be overridden per story in <story>/story.toml, EXCEPT:
#   llm_base_url, llm_api_key, embed_base_url, embed_api_key, default_stories_dir,
#   last_opened_story (global-only; llm_api_key or embed_api_key in a story.toml is
#   an error — stories are shareable).
# All of these are also viewable/editable at runtime via :settings in the TUI.

# --- LLM endpoint (OpenAI-compatible) ---
llm_base_url = "http://localhost:8080/v1"
# llm_api_key = "sk-..."        # only if your endpoint needs one; the setup wizard
                                 # writes this file with mode 0600

# --- Models ---
author_model = "local-model"
agent_model = "local-model"
embed_model = "nomic-embed-text"

# --- Embedding endpoint (optional) ---
# Leave unset to embed against llm_base_url above — correct for a local server that
# serves chat and embeddings together (Ollama, llama.cpp behind a router).
# Set these when your chat endpoint serves no embedding models. Hosted chat routers
# usually don't: OpenRouter serves NONE, so an OpenRouter setup needs an embedding
# provider here. The llm_api_key above is never forwarded to this endpoint.
# embed_base_url = "http://localhost:11434/v1"
# embed_api_key = "sk-..."

# --- Generation ---
author_temperature = 0.8
agent_temperature = 0.7

# --- Agent cadence (seconds) ---
author_interval = 300
default_agent_interval = 120
continuity_interval = 900
structure_analyst_interval = 180
projector_interval = 0.5

# --- Voice ---
# voice_pack = "/path/to/pack.toml"   # defaults to the shipped default pack
prose_profile = "plain"

# --- App ---
default_stories_dir = "stories"

# Managed by novelizer itself — no need to hand-edit:
# last_opened_story = "/path/to/last/story"        # picker preselection
# suppress_flat_migration_prompt = true            # set when you decline legacy migration
