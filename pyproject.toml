[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[project]
name = "novelizer"
version = "0.1.0"
description = "Autonomous world-building and storytelling agent system"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiosqlite>=0.20.0",
    "asyncpg>=0.31.0",
    "chromadb>=0.5.0",
    "click>=8.2.1",
    "deepagents>=0.6.12",
    "ebooklib>=0.18",
    "httpx>=0.28",
    "langchain>=1.3.14",
    "langchain-openai>=1.3.5",
    "langgraph>=1.2.9",
    "pydantic>=2.11.7",
    "pydantic-settings>=2.10.1",
    "rich>=14.1.0",
    "textual>=5.3.0",
    "tomli-w>=1.0.0",
]

[project.scripts]
novelizer = "novelizer.director.cli:main"

[dependency-groups]
dev = [
    "hypothesis>=6.156.6",
    "import-linter>=2.13",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-m 'not live_llm'"
markers = [
    "live_llm: requires a running OpenAI-compatible LLM endpoint (see Settings.llm_base_url)",
]

[tool.importlinter]
root_packages = ["substrate", "novelizer", "research_domain", "tui_kit"]

[[tool.importlinter.contracts]]
name = "substrate package boundary"
type = "forbidden"
source_modules = ["novelizer", "research_domain"]
allow_indirect_imports = "true"
forbidden_modules = [
    "substrate.agent_registry",
    "substrate.event_registry",
    "substrate.policy",
    "substrate.postgres",
    "substrate.projection",
]

[[tool.importlinter.contracts]]
name = "tui_kit independence"
type = "forbidden"
source_modules = ["tui_kit"]
forbidden_modules = ["novelizer", "substrate", "research_domain"]
